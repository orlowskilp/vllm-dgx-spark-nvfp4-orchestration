name: agents

services:
  vllm:
    image: ${IMAGE}
    container_name: vllm
    ipc: host
    # Strongly suggest to tighten security for model not to go rogue.
    security_opt:
      - seccomp=unconfined
    environment:
      - ANTHROPIC_BASE_URL=${VLLM_ADDR}:${VLLM_PORT}
      - ANTHROPIC_AUTH_TOKEN=vllm
      - HF_TOKEN=${HF_TOKEN}
      - MODEL=${HF_MODEL_NAME}
      - PORT=${VLLM_PORT}
      - HOST=${VLLM_ADDR}
      - MAX_MODEL_LEN=${CONTEXT_LEN}
      - GPU_MEMORY_UTIL=${GPU_MEM_UTIL}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS}
      - VLLM_NVFP4_GEMM_BACKEND=marlin
      - VLLM_FLASHINFER_MOE_BACKEND=latency
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - VLLM_TEST_FORCE_FP8_MARLIN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - >-
          VLLM_EXTRA_ARGS=--served-model-name ${SERVED_MODEL_NAME}
          --enable-chunked-prefill
          --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS}
          --enable-auto-tool-choice
          --tool-call-parser ${TOOL_CALL_PARSER}
          --attention-backend flashinfer
          --kv-cache-dtype fp8
          --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              count: all
    ports:
      - ${VLLM_ADDR}:${VLLM_PORT}:${VLLM_PORT}
    volumes:
      - $WD:/var/workspace
      - $VLLM_CACHE_DIR:/root/.cache
      - $VLLM_CACHE_DIR/flashinfer:/root/.cache/flashinfer
    networks:
      agents:

networks:
  agents:
    name: agents-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1
